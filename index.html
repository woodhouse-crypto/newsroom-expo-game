<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b1d36"/><title>新聞編輯室｜倒金字塔快閃挑戰</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08162a;color:#f9fafc;font-family:'Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.47;cursor:default}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.app{min-height:100dvh;display:flex;align-items:center;justify-content:center}.art{width:min(100vw,calc(100dvh*1672/941));aspect-ratio:1672/941;background-size:100% 100%;background-position:center;background-repeat:no-repeat;position:relative;overflow:hidden;isolation:isolate}.art[hidden],.game[hidden]{display:none!important}.start{background-image:url('assets/start.jpg')}.finish{background-image:url('assets/finish.png')}.hotzone{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.hotzone:focus-visible{outline:4px dashed #fff5a0;outline-offset:-5px}.start-btn{left:44%;top:68.8%;width:43%;height:15.7%}.restart-btn{left:56.5%;top:63.5%;width:39.3%;height:17%}.name-box{position:absolute;left:53.4%;top:51.6%;width:31%;height:10.6%;display:flex;align-items:center}.name-box input{width:100%;height:100%;padding:0 1%;background:transparent;border:0;outline:0;color:#15243d;font-weight:900;font-size:clamp(14px,2.6vw,43px);line-height:1.2;min-width:0}.name-box input::placeholder{color:#66686f;opacity:1;font-size:.83em}.name-box:focus-within{border-bottom:3px solid rgba(201,132,20,.6)}.name-error{position:absolute;left:50%;top:63%;width:37%;min-height:0;text-align:center;font-size:clamp(11px,1.3vw,20px);color:white;text-shadow:1px 2px #681622;font-weight:900;margin:0}.display-name{position:absolute;left:70.1%;top:29.2%;width:21.2%;height:9.3%;display:flex;align-items:center;justify-content:center;color:#0c1735;font-weight:900;text-align:center;overflow:hidden;overflow-wrap:anywhere;line-height:1.2;padding:0 1%;}.sound-toggle{position:fixed;z-index:22;top:10px;right:10px;background:#132a4b;color:#fff3b0;border:2px solid #ffe083;border-radius:7px;padding:8px 12px;font-weight:850;min-height:40px}.sound-toggle:focus-visible{outline:3px solid #fff}.game{width:min(1100px,96vw);background:#142746;border:5px solid #f6dc96;box-shadow:10px 10px 0 #061224;padding:clamp(14px,2.5vw,28px);margin:20px auto;display:block}.game h1{font-size:clamp(22px,3vw,40px);margin:0 0 10px;color:#ffecad;text-shadow:3px 3px #3d3651}.subheading{color:#bed8f3;line-height:1.6;margin:0 0 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{background:#304b6d;border:2px solid #b2e1ee;padding:8px 12px;font-size:clamp(13px,1.7vw,20px);font-weight:bold}.progress{display:flex;gap:12px;margin:18px 0}.dot{display:grid;place-items:center;flex:1;padding:7px;border:2px solid #657eae;color:#c5d3e9}.dot.current{background:#efbc45;color:#111d36;border-color:white}.dot.done{background:#2d9468;color:#fff}.npc-dialog{display:flex;align-items:center;gap:15px;padding:14px;border:3px solid #ffda72;background:#0e1b33;min-height:99px;margin:12px 0 20px}.npc-avatar{font-size:42px;border:2px solid #8be8d6;background:#314d6b;padding:7px;animation:npcBob 2s steps(2,end) infinite}.npc-name{font-size:16px;color:#ffe397;font-weight:900}.npc-text{font-size:clamp(15px,2vw,20px);line-height:1.5}.headline{font-size:clamp(20px,2.4vw,28px);color:#fff3c2;margin:15px 0}.news{display:flex;align-items:center;gap:10px;background:#fbf5dd;color:#132139;border:3px solid #bf8f4e;box-shadow:3px 3px #061224;padding:clamp(8px,1.3vw,15px);margin:10px 0}.news .num{flex-shrink:0;background:#e4a743;color:#17213c;padding:9px 13px;font-weight:950;font-size:20px}.news .content{flex:1;font-size:clamp(15px,1.8vw,20px);line-height:1.55}.controls{display:flex;flex-direction:column;gap:6px}.controls button{min-width:54px;min-height:44px;background:#395c91;color:white;border:2px solid #183359;font-size:19px;font-weight:bold}.controls button:active{transform:translateY(2px)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.actions button,.reset-actions button{min-height:50px;padding:12px 22px;background:#df3d4f;color:white;border:3px solid #ffd3b9;font-weight:900;font-size:clamp(16px,1.8vw,22px)}.actions button.alt,.reset-actions button.alt{background:#335c8a}.actions button.staff{background:transparent;border:2px solid #6d8ca7;font-size:14px;color:#d0dcec;margin-left:auto}.feedback{background:#223d62;border-left:5px solid #ffe588;padding:13px;margin-top:15px;font-size:clamp(15px,1.8vw,20px);line-height:1.6}.dialog-backdrop{position:fixed;inset:0;z-index:50;background:#050a13ce;display:grid;place-items:center;padding:20px}.dialog{background:#f8f0d9;color:#14223b;border:5px solid #d0a45b;box-shadow:8px 8px #050a17;width:min(500px,100%);padding:24px}.dialog h2{margin:0 0 8px}.reset-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:18px}.spark-layer{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}.spark{position:absolute;font-size:clamp(24px,4vw,48px);animation:sparkle 1.55s ease-out forwards}.win-popup{animation:winPop .45s steps(6,end)}@keyframes sparkle{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-180px) rotate(250deg);opacity:0}}@keyframes winPop{from{transform:scale(.96)}to{transform:scale(1)}}@keyframes npcBob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}@media(max-width:650px){.sound-toggle{font-size:12px;padding:5px;min-height:30px}.news{gap:5px}.news .num{padding:6px}.controls button{min-width:45px}.display-name{font-size:17px}}</style></head><body><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">🔊 音效：開</button><div class="spark-layer" id="sparkLayer" aria-hidden="true"></div><main class="app"><section id="start" class="art start" aria-label="新聞編輯室遊戲開始頁"><div class="name-box"><label class="sr-only" for="nickname">名字或暱稱，不限制四個字</label><input id="nickname" type="text" autocomplete="off" placeholder="名字或暱稱" aria-describedby="nameError"/></div><button id="begin" class="hotzone start-btn" type="button" aria-label="開始挑戰"></button><p id="nameError" class="name-error" role="alert"></p></section><section id="game" class="game hidden" aria-label="三關新聞排序挑戰"><div class="row"><h1>📰 新聞編輯室</h1><div class="row"><span id="player" class="tag"></span><span id="stage" class="tag"></span></div></div><p class="subheading">點選 ▲ ▼，將最重要的消息移到最前面。答錯可依提示重新排序。</p><div id="progress" class="progress"></div><div id="gameDialogueBox" class="npc-dialog"><div class="npc-avatar" aria-hidden="true">🧑🏻‍💼</div><div><div id="npcName" class="npc-name">主編小新</div><div id="npcText" class="npc-text"></div></div></div><h2 id="headline" class="headline"></h2><div id="cards"></div><div class="actions"><button type="button" id="check">確認排序 ✓</button><button type="button" id="next" class="alt hidden">下一關 ▶</button><button type="button" id="staffReset" class="staff">工作人員重設</button></div><div id="feedback" class="feedback hidden" aria-live="polite"></div></section><section id="finish" class="art finish hidden" aria-label="通關集章畫面"><div id="congrats" class="display-name" aria-live="polite"></div><button id="restart" class="hotzone restart-btn" type="button" aria-label="下一位挑戰者"></button><div class="sr-only" id="finishDialogue" aria-live="polite"></div></section></main><div id="resetDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><div class="dialog"><h2 id="resetTitle">要開始下一位挑戰者嗎？</h2><p>上一位的暱稱和闖關進度將會清除。</p><div class="reset-actions"><button id="cancelReset" type="button" class="alt">取消</button><button id="confirmReset" type="button">確定重設</button></div></div></div><script>
const levels=[{title:'第一關｜校園快訊：運動會登場',parts:[{id:'a',text:'某高中今日舉辦校園運動會，全校師生參與多項競賽與活動。'},{id:'b',text:'活動包括短跑、接力及趣味競賽，學生在操場為選手加油。'},{id:'c',text:'校方表示，運動會是每年舉辦的校園活動，鼓勵學生培養團隊合作精神。'}],order:['a','b','c'],tip:'先交代「發生什麼事」，再說明活動內容，最後補充背景。'}, {title:'第二關｜生活快訊：社區公園開放',parts:[{id:'a',text:'新公園設有兒童遊戲區、步道與休憩座椅，供民眾使用。'},{id:'b',text:'市府今日宣布，新建社區公園正式開放，居民即日起可入園休憩。'},{id:'c',text:'市府表示，未來將持續評估其他公共空間的改善需求。'},{id:'d',text:'公園位於住宅區旁，方便附近居民步行前往。'}],order:['b','a','d','c'],tip:'「正式開放」是核心消息，設施與地點是補充，未來規劃放後面。'}, {title:'第三關｜突發快訊：豪雨影響交通',parts:[{id:'a',text:'相關單位提醒用路人留意路況，必要時改走替代道路。'},{id:'b',text:'今日午後強降雨造成某市部分道路積水，數條公車路線一度改道。'},{id:'c',text:'當地氣象單位表示，午後對流旺盛，短時間內可能出現較大雨勢。'},{id:'d',text:'交通單位已派員處理積水路段，並持續更新公車行駛資訊。'}],order:['b','d','a','c'],tip:'先呈現交通受到的影響，再交代處理情況、民眾注意事項與天氣背景。'}];
let level=0,items=[],name='',passed=false;const $=id=>document.getElementById(id);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function show(which){['start','game','finish'].forEach(id=>$(id).classList.toggle('hidden',id!==which))}
// 音效完全由本機 Web Audio API 合成，不載入外部資源。
let soundOn=true,audioCtx=null;
function tone(freq=440,duration=.12,type='square',volume=.045,delay=0){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();let t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}
function sfx(kind){if(kind==='move')tone(340,.065,'square',.022);if(kind==='wrong'){tone(260,.12,'sawtooth',.035);tone(195,.16,'sawtooth',.03,.12)}if(kind==='right'){[523,659,784].forEach((f,i)=>tone(f,.16,'square',.045,i*.12))}if(kind==='finish'){[523,659,784,1046].forEach((f,i)=>tone(f,.23,'triangle',.08,i*.15))}if(kind==='start'){tone(440,.09);tone(660,.14,'square',.04,.1)}}
$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 音效：開':'🔇 音效：關';$('soundToggle').setAttribute('aria-pressed',String(soundOn));if(soundOn)sfx('move')};
const dialogues=[
'第一份快訊來了！把最重要的消息放第一段，讓讀者一眼看懂事件。',
'進階任務！公園新聞有四段，想想哪些是核心事實、哪些只是補充。',
'最後挑戰！突發豪雨新聞要先說明影響，再整理處理進度與背景。'
];
function say(t){$('npcText').textContent=t}
function sparkle(count=16){const root=$('sparkLayer');root.replaceChildren();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<count;i++){let e=document.createElement('span');e.className='spark';e.textContent=['✦','★','✧','◆'][i%4];e.style.left=(10+Math.random()*80)+'%';e.style.top=(42+Math.random()*45)+'%';e.style.color=['#ffde70','#88eced','#ff8aaa'][i%3];e.style.animationDelay=(Math.random()*.35)+'s';root.append(e)}setTimeout(()=>root.replaceChildren(),1900)}
function celebrate(final=false){sfx(final?'finish':'right');sparkle(final?32:18);let target=final?$('finish'):$('gameDialogueBox');target.classList.remove('win-popup');void target.offsetWidth;target.classList.add('win-popup')}
function begin(){name=$('nickname').value.trim().replace(/\s+/g,' ');if(!name){$('nameError').textContent='請輸入名字或暱稱。';return}$('nameError').textContent='';level=0;sfx('start');load()}function load(){passed=false;const q=levels[level];say(dialogues[level]);items=shuffle(q.parts);if(items.every((x,i)=>x.id===q.order[i]))items.reverse();$('player').textContent='編輯：'+name;$('stage').textContent=`第 ${level+1} / 3 關`;$('headline').textContent=q.title;$('progress').replaceChildren(...levels.map((_,i)=>{let e=document.createElement('div');e.className='dot '+(i<level?'done':i===level?'current':'');e.textContent=i<level?'✓':i+1;return e}));$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('check').disabled=false;render();show('game')}
function render(){let root=$('cards');root.replaceChildren();items.forEach((p,i)=>{let wrap=document.createElement('div');wrap.className='news';let num=document.createElement('div');num.className='num';num.textContent=i+1;let content=document.createElement('div');content.className='content';content.textContent=p.text;let controls=document.createElement('div');controls.className='controls';for(let [symbol,delta] of [['▲',-1],['▼',1]]){let btn=document.createElement('button');btn.className='alt';btn.textContent=symbol;btn.setAttribute('aria-label',`將第${i+1}段向${delta<0?'上':'下'}移動`);btn.disabled=passed||i+delta<0||i+delta>=items.length;btn.onclick=()=>{let j=i+delta;[items[i],items[j]]=[items[j],items[i]];$('feedback').classList.add('hidden');sfx('move');render()};controls.append(btn)}wrap.append(num,content,controls);root.append(wrap)})}
$('begin').onclick=begin;$('nickname').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});$('check').onclick=()=>{const q=levels[level],ok=items.every((p,i)=>p.id===q.order[i]);$('feedback').classList.remove('hidden');if(ok){celebrate(false);say(['太好了！你掌握了新聞導言的關鍵！','漂亮！主次分明，這就是專業編輯的判斷。','完美！你已經完成全部新聞排序任務！'][level]);passed=true;$('feedback').textContent='🎉 排序正確！'+q.tip;$('check').disabled=true;$('next').classList.remove('hidden');$('next').textContent=level===levels.length-1?'領取通關資格 ▶':'下一關 ▶';render()}else{sfx('wrong');say('別急！主編提示：'+q.tip);$('feedback').textContent='💡 再試一次！'+q.tip}};$('next').onclick=()=>{if(level===levels.length-1){$('congrats').textContent=name;$('congrats').style.fontSize = name.length>16?'clamp(12px,1.25vw,22px)':name.length>9?'clamp(13px,1.65vw,29px)':name.length>5?'clamp(15px,2vw,34px)':'clamp(18px,2.8vw,46px)';$('finishDialogue').textContent=name+'，你的新聞編輯任務全部完成！請向工作人員出示畫面集章。';show('finish');celebrate(true)}else{level++;load()}};function askReset(){ $('resetDialog').classList.remove('hidden'); $('cancelReset').focus() }function cancelReset(){ $('resetDialog').classList.add('hidden') }function resetAll(){ cancelReset();name='';level=0;items=[];passed=false;$('nickname').value='';$('congrats').textContent='';$('nameError').textContent='';$('feedback').classList.add('hidden');show('start');$('nickname').focus();$('sparkLayer').replaceChildren() }$('restart').onclick=askReset;$('staffReset').onclick=askReset;$('cancelReset').onclick=cancelReset;$('confirmReset').onclick=resetAll;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('resetDialog').classList.contains('hidden'))cancelReset()});

// Explicit initial view: only the start screen should be visible.
show('start');
</script></body></html>
